[workspace]
members = ["crates/core", "crates/web"]

[package]
name = "megathrone"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = "MIT"
edition = "2021"

[lib]
name = "megathrone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
sha2 = "0.10"

[dependencies]
megathrone-core = { path = "crates/core" }
tauri = { version = "2", features = [] }
serde_json = "1"
tauri-plugin-dialog = "2.7.3"
tokio = { version = "1.53.1", features = ["sync"] }

# the system tray is a desktop-only feature of the tauri crate
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
