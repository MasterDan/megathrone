[package]
name = "megathrone-web"
version = "0.1.0"
description = "Megathrone console web server (serves the browser UI)"
license = "MIT"
edition = "2021"

[dependencies]
megathrone-core = { path = "../core" }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
serde = "1"
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["fs"] }
