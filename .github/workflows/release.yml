name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  # build.rs verifies sidecar sha256s against the GitHub release API; the
  # token lifts the 60 req/h anonymous IP limit on shared CI runners.
  GITHUB_TOKEN: ${{ github.token }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    env:
      # ad-hoc sign the macOS bundle: an unsigned arm64 slice refuses to run on
      # Apple Silicon at all, and the codesign check below needs a signature.
      # Harmless on the windows/linux legs.
      APPLE_SIGNING_IDENTITY: '-'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows
            runner: windows-latest
            args: --bundles nsis
            rust-targets: ''
            artifacts: src-tauri/target/release/bundle/nsis/*.exe
          - label: macos
            runner: macos-latest
            # app+dmg: the .app must stay in bundle/macos for the signature check.
            # build.rs also stitches the universal sing-box/byedpi sidecars.
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifacts: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - label: linux
            runner: ubuntu-22.04
            args: --bundles deb,rpm,appimage
            rust-targets: ''
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
    steps:
      - uses: actions/checkout@v5

      - name: install linux deps
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            libgtk-3-dev libayatana-appindicator3-dev

      # pnpm version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # build.rs fetches the sing-box/byedpi sidecars for the target triple
      # before every build, so a plain tauri build is all it takes.
      - run: pnpm tauri build ${{ matrix.args }}

      - name: verify macOS bundle signature
        if: matrix.label == 'macos'
        run: |
          ls "src-tauri/target/universal-apple-darwin/release/bundle/macos" || true
          codesign --verify --verbose=2 "src-tauri/target/universal-apple-darwin/release/bundle/macos/Megathrone.app"

      - uses: actions/upload-artifact@v6
        with:
          name: artifacts-${{ matrix.label }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  build-arch:
    name: build (arch)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v5

      - name: install system dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git zstd \
            webkit2gtk-4.1 gtk3 openssl librsvg libayatana-appindicator

      # pnpm version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # deb/rpm/AppImage artifacts come from the ubuntu matrix leg; this job
      # only needs the bare binaries for the tarball + PKGBUILD, and the
      # AppImage tooling (linuxdeploy) can't run in a container anyway — no FUSE.
      - run: pnpm tauri build --no-bundle

      # tauri-build drops the sidecars next to the app binary in
      # target/release; an arch package must ship them together.
      - name: package arch artifacts
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          RT="$GITHUB_WORKSPACE"
          REL="$RT/src-tauri/target/release"
          VER="${TAG#v}"

          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=Megathrone' \
            'Comment=Desktop proxy client' \
            'Exec=megathrone' \
            'Icon=com.megathrone.app' \
            'Categories=Network;Utility;' \
            'Terminal=false' \
            'StartupWMClass=Megathrone' > "$RT/megathrone.desktop"

          tar -C "$REL" -caf "$RT/megathrone-$VER-x86_64-arch.tar.gz" \
            megathrone sing-box byedpi

          cat > "$RT/PKGBUILD" <<EOF
          pkgname=megathrone
          pkgver=$VER
          pkgrel=1
          pkgdesc="Desktop proxy client (sing-box + byedpi sidecars)"
          arch=('x86_64')
          url="$REPO_URL"
          license=('MIT')
          depends=('webkit2gtk-4.1' 'gtk3' 'hicolor-icon-theme')
          optdepends=('libayatana-appindicator: system tray')

          package() {
            install -Dm755 "$RT/src-tauri/target/release/megathrone" "\$pkgdir/usr/bin/megathrone"
            install -Dm755 "$RT/src-tauri/target/release/sing-box" "\$pkgdir/usr/bin/sing-box"
            install -Dm755 "$RT/src-tauri/target/release/byedpi" "\$pkgdir/usr/bin/byedpi"
            install -Dm644 "$RT/megathrone.desktop" "\$pkgdir/usr/share/applications/com.megathrone.app.desktop"
            install -Dm644 "$RT/src-tauri/icons/32x32.png" "\$pkgdir/usr/share/icons/hicolor/32x32/apps/com.megathrone.app.png"
            install -Dm644 "$RT/src-tauri/icons/64x64.png" "\$pkgdir/usr/share/icons/hicolor/64x64/apps/com.megathrone.app.png"
            install -Dm644 "$RT/src-tauri/icons/128x128.png" "\$pkgdir/usr/share/icons/hicolor/128x128/apps/com.megathrone.app.png"
            install -Dm644 "$RT/src-tauri/icons/128x128@2x.png" "\$pkgdir/usr/share/icons/hicolor/256x256/apps/com.megathrone.app.png"
          }
          EOF

          useradd -m builder 2>/dev/null || true
          chown -R builder:builder "$RT"
          su builder -c "cd '$RT' && makepkg --noconfirm --nodeps"

      - uses: actions/upload-artifact@v6
        with:
          name: artifacts-arch
          path: |
            *.pkg.tar.zst
            megathrone-*-x86_64-arch.tar.gz
          if-no-files-found: error

  publish:
    name: publish to release
    runs-on: ubuntu-latest
    needs: [build, build-arch]
    if: github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.pkg.tar.zst
            artifacts/**/*.tar.gz
